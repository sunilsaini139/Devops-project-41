apiVersion: apps/v1
kind: Deployment
metadata: 
  name: swigy-app
  labels:
    app: swigy-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swigy-app
  template:
    metadata:
      name: swigy-pod
      labels:
        app: swigy-app
    spec:
      terminationGracePeriodSeconds: 30 
      containers:
      - name: swigy-containers
        image: sunilssaini139/swigy-app:latest
        imagePullPolicy: "Always" 
        ports:
        - containerPort: 3000
